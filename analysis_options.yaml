include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/app_localizations*.dart
    - build/**
    - android/**
    - ios/**
  errors:
    # Generated providers/models document themselves via their source.
    invalid_annotation_target: ignore

linter:
  rules:
    # App code, not a published package.
    public_member_api_docs: false
    # Dart 3.13 allows `const new(...)`; we keep classic `ClassName(...)`
    # constructors: familiar to every Flutter dev and required by freezed's
    # factory constructors.
    unnecessary_type_name_in_constructor: false
